<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste a Sua Sorte - Classes</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #242018 0%, #080808 60%, #000 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Georgia, 'Times New Roman', serif;
            color: #f5f5f5;
        }

        .back-button, .reroll-button {
            position: fixed;
            top: 20px;
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid #d4af37;
            background: rgba(0, 0, 0, 0.75);
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
            z-index: 1000;
        }

        .back-button { left: 20px; }
        .reroll-button { right: 20px; }

        .back-button:hover, .reroll-button:hover {
            background: #d4af37;
            color: #000;
            transform: scale(1.05);
        }

        .screen-title {
            position: fixed;
            top: 82px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 900;
            text-align: center;
            pointer-events: none;
        }

        .screen-title h1 {
            margin: 0;
            color: #d4af37;
            letter-spacing: 0.18em;
            font-weight: 300;
            text-transform: uppercase;
            font-size: clamp(1.4rem, 4vw, 2.5rem);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.35);
        }

        .screen-title p {
            margin: 0.6rem 0 0;
            color: #cfc7a0;
            letter-spacing: 0.08em;
            font-size: 0.85rem;
        }

        .card-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .card {
            position: absolute;
            width: 200px;
            height: 300px;
            border-radius: 15px;
            box-sizing: border-box;
            cursor: pointer;
            color: white;
            backdrop-filter: blur(5px);
            transform-style: preserve-3d;
            transition: transform 0.6s, opacity 5s ease;
        }

        .card:hover {
            transform: scale(1.1);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
        }

        .card-front {
            background: url('output.jpg') no-repeat center center;
            background-size: cover;
        }

        .card-back {
            background: linear-gradient(160deg, rgba(5, 5, 5, 0.94), rgba(25, 20, 10, 0.86));
            transform: rotateY(180deg);
            color: white;
        }

        .card.common .card-front, .card.common .card-back {
            border: 2px solid #c0c0c0;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.7);
        }

        .card.rare .card-front, .card.rare .card-back {
            border: 2px solid #007bff;
            box-shadow: 0 0 28px rgba(0, 123, 255, 0.8);
        }

        .card.epic .card-front, .card.epic .card-back {
            border: 2px solid #800080;
            box-shadow: 0 0 35px rgba(128, 0, 128, 0.9);
        }

        .card.legendary .card-front, .card.legendary .card-back {
            border: 2px solid #ffd700;
            box-shadow: 0 0 42px rgba(255, 215, 0, 1.0);
        }

        .card.unique .card-front, .card.unique .card-back {
            border: 2px solid #dc3545;
            box-shadow: 0 0 50px rgba(220, 53, 69, 1.0);
        }

        .rarity-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .common .rarity-indicator { background: #c0c0c0; }
        .rare .rarity-indicator { background: #007bff; }
        .epic .rarity-indicator { background: #800080; }
        .legendary .rarity-indicator { background: #ffd700; }
        .unique .rarity-indicator { background: #dc3545; }

        .card-title {
            font-size: 1.45em;
            line-height: 1.2;
            margin: 12px 0;
            color: #f5f5f5;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
        }

        .rarity-label {
            color: #d4af37;
            font-size: 0.78em;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .chance-label {
            color: #cfcfcf;
            font-size: 0.82em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .hidden-note {
            margin-top: 18px;
            font-size: 0.74em;
            color: #9f9473;
            letter-spacing: 0.05em;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">Voltar</a>
    <button class="reroll-button" onclick="window.location.reload()">Reroll</button>
    <div class="screen-title">
        <h1>Teste a Sua Sorte</h1>
        <p>Escolha uma carta. Evoluções permanecem ocultas.</p>
    </div>
    <div class="card-container" id="cardContainer"></div>

    <script>
        const classes = [
            // Comuns (44%)
            { name: 'Guerreiro', rarity: 'common' },
            { name: 'Mago', rarity: 'common' },
            { name: 'Caçador', rarity: 'common' },
            { name: 'Clérigo', rarity: 'common' },
            { name: 'Ladrão', rarity: 'common' },
            { name: 'Feiticeiro', rarity: 'common' },
            { name: 'Druida', rarity: 'common' },
            { name: 'Bardo', rarity: 'common' },
            { name: 'Monge', rarity: 'common' },

            // Raras (28%)
            { name: 'Espadachim', rarity: 'rare' },
            { name: 'Atirador', rarity: 'rare' },
            { name: 'Padre', rarity: 'rare' },
            { name: 'Gladiador', rarity: 'rare' },
            { name: 'Elementalista', rarity: 'rare' },

            // Épicas (14%)
            { name: 'Marionetista', rarity: 'epic' },
            { name: 'Guardião Celestial', rarity: 'epic' },
            { name: 'Cavaleiro Dimensional', rarity: 'epic' },
            { name: 'Domador de Monstros', rarity: 'epic' },
            { name: 'Engenheiro Arcano', rarity: 'epic' },
            { name: 'Caçador de Dragões', rarity: 'epic' },
            { name: 'Artífice', rarity: 'epic' },
            { name: 'Tecelão de Destinos', rarity: 'epic' },
            { name: 'Mestre das Runas', rarity: 'epic' },
            { name: 'Cavaleiro Elemental', rarity: 'epic' },
            { name: 'Aventureiro', rarity: 'epic' },
            { name: 'Mestre de Cerco', rarity: 'epic' },
            { name: 'Ferreiro de Magia', rarity: 'epic' },
            { name: 'Mestre dos Elementos', rarity: 'epic' },
            { name: 'Portador do Vazio', rarity: 'epic' },
            { name: 'Senhor do Caos', rarity: 'epic' },
            { name: 'Guardião do Éter', rarity: 'epic' },
            { name: 'Cavaleiro da Luz', rarity: 'epic' },

            // Lendárias (9%)
            { name: 'Herdeiro de Relíquias Antigas', rarity: 'legendary' },
            { name: 'Ilusionista', rarity: 'legendary' },
            { name: 'Manipulador do Tempo', rarity: 'legendary' },
            { name: 'Fazendeiro', rarity: 'legendary' },
            { name: 'Ferreiro', rarity: 'legendary' },
            { name: 'Navegador', rarity: 'legendary' },
            { name: 'Cozinheiro', rarity: 'legendary' },
            { name: 'Herborista', rarity: 'legendary' },
            { name: 'Comerciante', rarity: 'legendary' },
            { name: 'Mensageiro', rarity: 'legendary' },
            { name: 'Escudeiro', rarity: 'legendary' },
            { name: 'Pescador', rarity: 'legendary' },
            { name: 'Arauto da Morte', rarity: 'legendary' },
            { name: 'Lorde dos Pesadelos', rarity: 'legendary' },
            { name: 'Mestre da Gravidade', rarity: 'legendary' },
            { name: 'Avatar de Constelações', rarity: 'legendary' },
            { name: 'Guardião das Estrelas', rarity: 'legendary' },

            // Únicas (5%)
            { name: 'Regressor', rarity: 'unique' },
            { name: 'Mestre das Sombras', rarity: 'unique' },
            { name: 'Colecionador de Habilidades', rarity: 'unique' },
            { name: 'Contratante', rarity: 'unique' },
            { name: 'Bibliotecário', rarity: 'unique' },
        ];

        const rarityMeta = {
            common: { label: 'Comum', chance: '44%' },
            rare: { label: 'Rara', chance: '28%' },
            epic: { label: 'Épica', chance: '14%' },
            legendary: { label: 'Lendária', chance: '9%' },
            unique: { label: 'Única', chance: '5%' },
        };

        function createCard(classData) {
            const card = document.createElement('div');
            card.className = `card ${classData.rarity}`;
            card.addEventListener('click', () => {
                if (card.classList.contains('is-flipped') || card.style.opacity === '0') return;

                card.classList.toggle('is-flipped');

                const allCards = document.getElementById('cardContainer').getElementsByClassName('card');
                Array.from(allCards).forEach(otherCard => {
                    if (otherCard !== card) {
                        otherCard.style.opacity = '0';
                        setTimeout(() => { otherCard.style.display = 'none'; }, 5000);
                    }
                });
            });

            const meta = rarityMeta[classData.rarity];
            const cardInner = document.createElement('div');
            cardInner.className = 'card-inner';

            const cardFront = document.createElement('div');
            cardFront.className = 'card-front';

            const cardBack = document.createElement('div');
            cardBack.className = 'card-back';

            const rarityIndicator = document.createElement('div');
            rarityIndicator.className = 'rarity-indicator';

            const rarityLabel = document.createElement('div');
            rarityLabel.className = 'rarity-label';
            rarityLabel.textContent = meta.label;

            const title = document.createElement('div');
            title.className = 'card-title';
            title.textContent = classData.name;

            const chance = document.createElement('div');
            chance.className = 'chance-label';
            chance.textContent = `Chance ${meta.chance}`;

            const hiddenNote = document.createElement('div');
            hiddenNote.className = 'hidden-note';
            hiddenNote.textContent = 'Caminhos futuros não revelados.';

            cardBack.appendChild(rarityIndicator);
            cardBack.appendChild(rarityLabel);
            cardBack.appendChild(title);
            cardBack.appendChild(chance);
            cardBack.appendChild(hiddenNote);

            cardInner.appendChild(cardFront);
            cardInner.appendChild(cardBack);
            card.appendChild(cardInner);

            return card;
        }

        function animateCards() {
            const container = document.getElementById('cardContainer');
            const cards = container.getElementsByClassName('card');

            Array.from(cards).forEach(card => {
                const x = Math.random() * Math.max(1, window.innerWidth - 240);
                const y = Math.random() * Math.max(1, window.innerHeight - 340);
                card.style.transform = `translate(${x}px, ${y}px)`;
            });
        }

        function selectRandomClasses(allClasses, numberOfCards) {
            const rarityChances = [
                { rarity: 'common', chance: 44 },
                { rarity: 'rare', chance: 28 },
                { rarity: 'epic', chance: 14 },
                { rarity: 'legendary', chance: 9 },
                { rarity: 'unique', chance: 5 },
            ];

            const byRarity = allClasses.reduce((acc, c) => {
                (acc[c.rarity] ||= []).push(c);
                return acc;
            }, {});

            const availableByRarity = Object.fromEntries(
                Object.entries(byRarity).map(([rarity, list]) => [rarity, [...list]])
            );

            const totalChance = rarityChances.reduce((sum, r) => sum + r.chance, 0);

            function rollRarity() {
                const roll = Math.random() * totalChance;
                let cumulative = 0;
                for (const r of rarityChances) {
                    cumulative += r.chance;
                    if (roll < cumulative) return r.rarity;
                }
                return rarityChances[rarityChances.length - 1].rarity;
            }

            function pickAndRemoveRandom(list) {
                if (!list || list.length === 0) return null;
                const idx = Math.floor(Math.random() * list.length);
                return list.splice(idx, 1)[0];
            }

            const selected = [];
            for (let i = 0; i < numberOfCards; i++) {
                const rarity = rollRarity();
                let picked = pickAndRemoveRandom(availableByRarity[rarity]);

                if (!picked) {
                    const flat = Object.values(availableByRarity).flat();
                    if (flat.length === 0) break;
                    const fallbackRarity = flat[Math.floor(Math.random() * flat.length)].rarity;
                    picked = pickAndRemoveRandom(availableByRarity[fallbackRarity]);
                }

                if (picked) selected.push(picked);
            }

            return selected;
        }

        function initializeCards() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';
            const selectedClasses = selectRandomClasses(classes, 15);
            selectedClasses.forEach(classData => container.appendChild(createCard(classData)));
            animateCards();
        }

        window.addEventListener('load', initializeCards);
        window.addEventListener('resize', animateCards);
    </script>
</body>
</html>
